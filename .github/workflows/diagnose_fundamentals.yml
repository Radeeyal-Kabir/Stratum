name: Diagnose fundamentals

# One-off/reusable debugging tool: runs the real fetch_fundamentals.py lookup
# functions against a single company's live XBRL facts and prints what _at()
# actually found (or didn't) for each target quarter-end, plus a trimmed slice
# of the raw facts behind it — so a silent gap like "debt/equity always None
# for this filer" can be diagnosed against real data instead of guessed at
# blind. Printed to the job log directly (not an artifact — some callers'
# network policy blocks the blob-storage host artifact downloads redirect
# to, even though the GitHub API itself is reachable).
# No Ollama, no data/ writes — read-only, and fast.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Ticker to dump raw XBRL facts for
        required: true
      pattern:
        description: Comma-separated words; list every us-gaap concept whose name contains one
        required: false
        default: "Debt,Notes,Loan,Borrowing"

permissions:
  contents: read

env:
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnose the equity lookup using the real pipeline functions
        env:
          TICKER: ${{ inputs.ticker }}
          PATTERN: ${{ inputs.pattern }}
        run: |
          python - <<'PY'
          import json
          import os

          from screener import edgar_client
          from screener.fetch_fundamentals import _at, _pick_series, _usd_facts

          ticker = os.environ["TICKER"].upper()
          cik = edgar_client.resolve_ciks([ticker])[ticker]
          facts = edgar_client.get_companyfacts(cik)

          rev_series, rev_concept = _pick_series(facts, "revenue", flow=True)
          quarter_ends = sorted(rev_series)[-8:]
          print(f"revenue concept: {rev_concept}")
          print("Quarter-end dates compute_fundamentals() targets (last 8):",
                [d.isoformat() for d in quarter_ends])

          from datetime import date, timedelta
          lo, hi = min(quarter_ends), max(quarter_ends)

          def report(name):
              series, concept = _pick_series(facts, name, flow=False)
              print(f"\n{name} concept picked: {concept}, {len(series)} instant data points total")
              for target in quarter_ends:
                  val = _at(series, target)
                  nearest = min(series, key=lambda d: abs((d - target).days), default=None)
                  gap = abs((nearest - target).days) if nearest else None
                  print(f"  target={target.isoformat()}  _at_result={val}  "
                        f"nearest_available={nearest.isoformat() if nearest else None}  gap_days={gap}")
              raw = _usd_facts(facts, concept) if concept else []
              trimmed = [
                  r for r in raw
                  if lo - timedelta(days=30) <= date.fromisoformat(r["end"]) <= hi + timedelta(days=30)
              ]
              print(f"{name}: trimmed raw facts ({len(trimmed)} of {len(raw)} total), concept={concept!r}:")
              print(json.dumps(trimmed, indent=2, sort_keys=True))
              return concept

          report("equity")
          report("debt_total")
          report("debt_noncurrent")
          report("debt_current")

          # None of our candidate debt concepts have data past 2023-07-31 for this filer --
          # it must be tagging debt under some other concept post-2023. List every us-gaap
          # concept whose name mentions debt/notes, with its most recent instant "end" date,
          # to find what it actually switched to.
          usgaap = facts.get("facts", {}).get("us-gaap", {})
          words = [w for w in os.environ.get("PATTERN", "").split(",") if w] or ["Debt", "Notes", "Loan", "Borrowing"]
          print(f"\nConcepts matching {words} and their latest instant 'end' date + value:")
          hits = []
          for name, node in usgaap.items():
              if not any(k in name for k in words):
                  continue
              usd = node.get("units", {}).get("USD", [])
              inst = [f for f in usd if "start" not in f]  # instant facts only
              if inst:
                  last = max(inst, key=lambda f: (f["end"], f["filed"]))
                  hits.append((last["end"], name, len(usd), last["val"]))
          for end, name, n, val in sorted(hits, reverse=True)[:40]:
              print(f"  latest_end={end}  value={val:,.0f}  concept={name}  n_facts={n}")
          PY
